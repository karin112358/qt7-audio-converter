name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish all runtimes
        run: |
          for rid in win-x64 osx-x64 osx-arm64; do
            dotnet publish src/QuickTimeConverter.Cli -c Release -r "$rid" \
              --self-contained -p:PublishSingleFile=true -p:DebugType=none \
              -o "publish/$rid"
          done

      - name: Package assets
        run: |
          mkdir -p assets
          (cd publish/win-x64 && zip -r ../../assets/qt7convert-win-x64.zip .)
          for rid in osx-x64 osx-arm64; do
            chmod +x "publish/$rid/qt7convert"
            tar czf "assets/qt7convert-$rid.tar.gz" -C "publish/$rid" qt7convert
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" assets/* \
            --title "${{ github.ref_name }}" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
